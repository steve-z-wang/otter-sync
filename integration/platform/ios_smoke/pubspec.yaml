name: axton_ios_smoke
description: iOS simulator smoke harness for axton.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  # run_ios_simulator_smoke.sh overrides this with a staged package whose
  # build hook bundles the simulator library from build/axton-libraries.
  axton:
    path: ../../../packages/frontend/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    axton:
      local_artifacts: build/axton-libraries
